
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>¿Puedo Jubilarme?</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>🚀 ¿Puedo Jubilarme?</h1>

        <p>Ingresá tus datos para saber si estás en edad de jubilarte.</p>

        <label for="edad">¿Cuántos años tenés?</label>
        <input type="number" id="edad" placeholder="Ingresá tu edad">

        <label for="sexo">Seleccioná tu género:</label>
        <select id="sexo">
            <option value="">Seleccionar</option>
            <option value="mujer">Mujer</option>
            <option value="hombre">Hombre</option>
        </select>

        <button id="calcular">Consultar</button>

        <h2 id="resultado"></h2>

    </div>

    <script src="script.js"></script>

</body>
</html>
